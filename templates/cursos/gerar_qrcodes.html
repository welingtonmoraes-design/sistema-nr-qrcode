{% extends "base.html" %}
{% block content %}
<h2>Gerar QR Codes em Lote (A4)</h2>
<form method="POST">
    <div class="mb-3">
        <p>Selecione os colaboradores para gerar o PDF com QR Codes:</p>
        {% for c in colaboradores %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="colaboradores" value="{{ c.id }}" id="col{{ c.id }}">
                <label class="form-check-label" for="col{{ c.id }}">{{ c.nome }} - {{ c.cpf }}</label>
            </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Gerar PDF</button>
</form>
{% endblock %}
