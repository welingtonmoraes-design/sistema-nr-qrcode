{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Colaboradores</h2>
    <a href="{{ url_for('colaboradores.novo') }}" class="btn btn-primary">+ Novo Colaborador</a>
</div>

<form method="GET" class="mb-3">
    <input type="text" name="busca" value="{{ busca }}" class="form-control" placeholder="Buscar por nome...">
</form>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Matrícula</th>
            <th>Ativo</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
    {% for c in colaboradores %}
        <tr>
            <td><a href="{{ url_for('colaboradores.detalhes', id=c.id) }}">{{ c.nome }}</a></td>
            <td>{{ c.cpf }}</td>
            <td>{{ c.matricula }}</td>
            <td>{{ "Sim" if c.ativo else "Não" }}</td>
            <td>
                <a href="{{ url_for('colaboradores.editar', id=c.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <form method="POST" action="{{ url_for('colaboradores.excluir', id=c.id) }}" style="display:inline;" onsubmit="return confirm('Confirma exclusão?');">
                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
