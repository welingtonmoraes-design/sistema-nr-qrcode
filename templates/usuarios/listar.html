{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Usuários do Sistema</h2>
    <a href="{{ url_for('usuarios.novo') }}" class="btn btn-primary">+ Novo Usuário</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nome</th>
            <th>SSO</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
    {% for u in usuarios %}
        <tr>
            <td>{{ u.nome }}</td>
            <td>{{ u.sso }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.perfil }}</td>
            <td>
                <a href="{{ url_for('usuarios.editar', id=u.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <form method="POST" action="{{ url_for('usuarios.excluir', id=u.id) }}" style="display:inline;" onsubmit="return confirm('Confirma exclusão?');">
                    <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
